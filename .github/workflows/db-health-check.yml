name: DB Health Check

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install pg
      - run: node scripts/db-health-check.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
