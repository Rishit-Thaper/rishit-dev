name: Build Resume PDF

on:
  push:
    branches: [main]
    paths:
      - 'resume/resume.tex'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume

      - name: Move PDF into public/
        run: mv resume/resume.pdf public/resume.pdf

      - name: Commit updated resume.pdf
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/resume.pdf
          git diff --staged --quiet || git commit -m "chore: rebuild resume.pdf from LaTeX source"
          git push
